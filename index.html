<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RDgene</title>
  <link rel="icon" href="https://ehrencrona.org/favicon.ico">
  <link rel="stylesheet" href="https://ehrencrona.org/shared.css">
  <style>
    .summary-section { margin-top: 20px; display: none }
    .summary-section.visible { display: block }
    .summary-label { font-size: .82rem; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px }
    .summary-label .gene-name { text-transform: none }
    .summary-text { font-size: .95rem; line-height: 1.55; color: var(--text) }
    .summary-text.loading { color: var(--muted); font-style: italic }
    .summary-text.error   { color: var(--muted); font-style: italic }

    .sources-section { margin-top: 20px; display: none }
    .sources-section.visible { display: block }
    .sources-label { font-size: .82rem; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px }

    .source-grid { display: grid; gap: 10px }

    .source-btn {
      text-decoration: none;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 13px 16px;
      box-shadow: var(--shadow);
      transition: border-color .15s ease, transform .15s ease;
      color: inherit;
    }
    .source-btn:visited { color: inherit }
    .source-btn:hover { border-color: color-mix(in srgb, var(--brand) 60%, var(--border)); transform: translateY(-1px) }
    .source-btn.disabled { opacity: .4; pointer-events: none }
    @media (prefers-reduced-motion: reduce) {
      .source-btn { transition: none }
      .source-btn:hover { transform: none }
    }
    .source-name { font-size: 1.02rem; font-weight: 650; color: var(--title-color) }
    .source-btn:hover .source-name { color: var(--brand) }
    .source-arrow { color: var(--brand); font-size: .95rem }

    .error-msg {
      margin-top: 16px;
      padding: 12px 16px;
      border-radius: 8px;
      background: color-mix(in srgb, var(--brand) 10%, var(--card));
      border: 1px solid color-mix(in srgb, var(--brand) 30%, var(--border));
      color: var(--brand);
      font-size: .95rem;
      display: none;
    }
    .error-msg.visible { display: block }
  </style>
</head>
<body>
<div class="page">
  <header class="brand-header">
    <a href="https://ehrencrona.org">
      <picture>
        <source srcset="https://ehrencrona.org/ehrencrona_logo_darkmode.png" media="(prefers-color-scheme: dark)">
        <img class="brand-logo" src="https://ehrencrona.org/ehrencrona_logo.png" alt="Ehrencrona logo">
      </picture>
    </a>
  </header>

  <main class="content">
    <div class="content-inner">
      <h1 class="home-title">RDgene</h1>

      <div class="card">
        <div class="search-wrap">
          <p class="card-desc">Enter a gene symbol to access curated rare disease resources</p>
          <div class="search-row">
            <input
              class="field"
              id="gene-input"
              type="search"
              placeholder="Enter gene symbol, e.g. BRCA1"
              autocomplete="off"
              autocorrect="off"
              autocapitalize="characters"
              spellcheck="false"
            >
            <button class="search-btn" id="search-btn">Search</button>
          </div>
        </div>

        <div class="error-msg" id="error-msg"></div>

        <div class="summary-section" id="summary-section">
          <div class="summary-label" id="summary-label">NCBI Gene Summary</div>
          <div class="summary-text" id="summary-text"></div>
        </div>

        <div class="sources-section" id="sources-section">
          <div class="sources-label">Resources</div>
          <div class="source-grid" id="source-grid"></div>
        </div>
      </div>

    </div>
  </main>
</div>

<script>
  // Each source declares which identifier it needs via `type`, and its url()
  // builder receives that identifier at render time:
  //   gene    -> the official HGNC symbol (correct casing, e.g. C9orf72)
  //   hgnc    -> numeric HGNC id
  //   omim    -> OMIM id
  //   uniprot -> canonical UniProt accession
  //   ensembl -> Ensembl gene id (ENSG…)
  // A source is auto-disabled when its identifier is unavailable for a gene.
  const SOURCES = [
    { name: "GenetikLund",        type: "gene",    url: g  => `https://genpaneler.genetiklund.se/search/${g}`, order: 0 },
    { name: "ClinGen CSpec",      type: "hgnc",    url: id => `https://cspec.genome.network/cspec/ui/svi/?search=HGNC:${id}`, order: 10 },
    { name: "ClinGen KB",         type: "hgnc",    url: id => `https://search.clinicalgenome.org/kb/genes/HGNC:${id}`, order: 10 },
    { name: "ClinVar",            type: "gene",    url: g  => `https://www.ncbi.nlm.nih.gov/clinvar/?term=${encodeURIComponent(g)}[gene]`, order: 10 },
    { name: "DECIPHER",           type: "gene",    url: g  => `https://www.deciphergenomics.org/gene/${g}`, order: 10 },
    { name: "Ensembl",            type: "ensembl", url: id => `https://www.ensembl.org/Homo_sapiens/Gene/Summary?g=${id}`, order: 10 },
    { name: "GenCC",              type: "hgnc",    url: id => `https://thegencc.org/genes/HGNC:${id}`, order: 10 },
    { name: "GeneCards",          type: "gene",    url: g  => `https://www.genecards.org/cgi-bin/carddisp.pl?gene=${g}`, order: 10 },
    { name: "Gene2Phenotype",     type: "gene",    url: g  => `https://www.ebi.ac.uk/gene2phenotype/search?query=${g}`, order: 10 },
    { name: "GeneReviews",        type: "gene",    url: g  => `https://www.ncbi.nlm.nih.gov/books/NBK1116/?term=${encodeURIComponent(g)}`, order: 10 },
    { name: "GTEx",               type: "ensembl", url: id => `https://www.gtexportal.org/home/gene/${id}`, order: 10 },
    { name: "gnomAD",             type: "gene",    url: g  => `https://gnomad.broadinstitute.org/gene/${g}`, order: 10 },
    { name: "MedGen",             type: "gene",    url: g  => `https://www.ncbi.nlm.nih.gov/medgen/?term=${encodeURIComponent(g)}`, order: 10 },
    { name: "MedlinePlus",        type: "gene",    url: g  => `https://medlineplus.gov/genetics/gene/${g.toLowerCase()}/`, order: 10 },
    { name: "Monarch Initiative", type: "hgnc",    url: id => `https://monarchinitiative.org/HGNC:${id}`, order: 10 },
    { name: "OMIM",               type: "omim",    url: id => `https://www.omim.org/entry/${id}`, order: 10 },
    { name: "Orphanet",           type: "gene",    url: g  => `https://www.orpha.net/en/disease/gene/${g}`, order: 10 },
    { name: "PanelApp AU",        type: "gene",    url: g  => `https://panelapp-aus.org/panels/entities/${g}`, order: 10 },
    { name: "PanelApp UK",        type: "gene",    url: g  => `https://panelapp.genomicsengland.co.uk/panels/entities/${g}`, order: 10 },
    { name: "RareChromo",         type: "gene",    url: g  => `https://rarechromo.org/?s=${encodeURIComponent(g)}`, order: 10 },
    { name: "Socialstyrelsen",    type: "gene",    url: g  => `https://www.socialstyrelsen.se/sok/?q=${encodeURIComponent(g)}`, order: 10 },
    { name: "UniProt",            type: "uniprot", url: id => `https://www.uniprot.org/uniprotkb/${id}/entry`, order: 10 },
  ];

  const geneInput      = document.getElementById('gene-input');
  const searchBtn      = document.getElementById('search-btn');
  const errorMsg       = document.getElementById('error-msg');
  const summarySection = document.getElementById('summary-section');
  const summaryLabel   = document.getElementById('summary-label');
  const summaryText    = document.getElementById('summary-text');
  const sourcesSection = document.getElementById('sources-section');
  const sourceGrid     = document.getElementById('source-grid');

  async function runSearch() {
    const gene = geneInput.value.trim();
    if (!gene) return;
    errorMsg.classList.remove('visible');
    summarySection.classList.remove('visible');
    sourcesSection.classList.remove('visible');
    setSummaryLabel(gene);
    summaryText.textContent  = 'Loading…';
    summaryText.className     = 'summary-text loading';
    sourceGrid.innerHTML      = '';

    const hgncData = await fetchHGNC(gene);
    if (!hgncData) {
      errorMsg.textContent = `"${gene}" was not recognised as a valid HGNC gene symbol.`;
      errorMsg.classList.add('visible');
      return;
    }

    summarySection.classList.add('visible');
    sourcesSection.classList.add('visible');

    // Drive every symbol-based link off the *official* HGNC symbol so that
    // mixed-case symbols (e.g. C9orf72) resolve correctly at path-based resources.
    const symbol    = hgncData?.symbol || gene;
    const hgncId    = hgncData?.hgnc_id?.replace('HGNC:', '');
    const omimId    = hgncData?.omim_id?.[0];
    const entrezId  = hgncData?.entrez_id;
    const uniprotId = hgncData?.uniprot_ids?.[0];
    const ensemblId = hgncData?.ensembl_gene_id;

    setSummaryLabel(symbol);
    geneInput.value = symbol;

    const geneUrl     = entrezId ? `https://www.ncbi.nlm.nih.gov/gene/${entrezId}` : null;
    const summaryData = await fetchNCBISummary(entrezId);
    renderSummary(summaryData, geneUrl);

    renderSources({ gene: symbol, hgnc: hgncId, omim: omimId, uniprot: uniprotId, ensembl: ensemblId });
  }

  async function fetchHGNC(gene) {
    const fetchDoc = async (field, value) => {
      try {
        const res  = await fetch(`https://rest.genenames.org/fetch/${field}/${encodeURIComponent(value)}`, { headers: { Accept: 'application/json' } });
        const data = await res.json();
        return data?.response?.docs?.[0] ?? null;
      } catch { return null; }
    };
    // Fast path: direct symbol fetch (HGNC matches approved symbols case-insensitively).
    let doc = await fetchDoc('symbol', gene);
    if (doc) return doc;
    // Fallback: resolve via the case-insensitive search endpoint, then fetch the
    // full record by HGNC id. Only accept an exact (case-insensitive) symbol match.
    try {
      const res  = await fetch(`https://rest.genenames.org/search/symbol/${encodeURIComponent(gene)}`, { headers: { Accept: 'application/json' } });
      const data = await res.json();
      const hit  = data?.response?.docs?.find(d => d.symbol?.toUpperCase() === gene.toUpperCase());
      if (hit?.hgnc_id) return await fetchDoc('hgnc_id', hit.hgnc_id.replace('HGNC:', ''));
    } catch {}
    return null;
  }

  async function fetchNCBISummary(entrezId) {
    if (!entrezId) return null;
    try {
      const res = await fetch(`https://eutils.ncbi.nlm.nih.gov/entrez/eutils/esummary.fcgi?db=gene&id=${entrezId}&retmode=json`);
      const data = await res.json();
      return data?.result?.[entrezId]?.summary || null;
    } catch { return null }
  }

  function setSummaryLabel(name) {
    summaryLabel.textContent = 'NCBI Gene Summary – ';
    const span = document.createElement('span');
    span.className = 'gene-name';
    span.textContent = name;
    summaryLabel.appendChild(span);
  }

  function renderSummary(text, geneUrl) {
    summaryText.innerHTML = '';
    if (!text) {
      summaryText.textContent = 'No gene summary available.';
      summaryText.className   = 'summary-text error';
      return;
    }
    summaryText.className = 'summary-text';

    const makeLink = (label) => {
      const a = document.createElement('a');
      a.href = geneUrl;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.textContent = label;
      return a;
    };

    // Linkify the trailing attribution (e.g. "[provided by RefSeq, May 2020]")
    // to the full NCBI Gene entry. If no such attribution exists, append a
    // compact "[NCBI Gene]" link so the entry is always reachable.
    const attrMatch = text.match(/\s*\[[^\]]*\]\s*$/);
    if (geneUrl && attrMatch) {
      summaryText.append(document.createTextNode(text.slice(0, attrMatch.index) + ' '));
      summaryText.append(makeLink(attrMatch[0].trim()));
    } else if (geneUrl) {
      summaryText.append(document.createTextNode(text + ' '));
      summaryText.append(makeLink('[NCBI Gene]'));
    } else {
      summaryText.textContent = text;
    }
  }

  function renderSources(ids) {
    sourceGrid.innerHTML = '';
    const first = SOURCES.find(s => s.order === 0);
    const rest  = SOURCES.filter(s => s.order !== 0).sort((a, b) => a.name.localeCompare(b.name, 'sv'));
    for (const source of [first, ...rest]) {
      const value = ids[source.type];
      const href  = value ? source.url(value) : null;
      const btn = document.createElement('a');
      btn.className = 'source-btn';
      if (href) { btn.href = href; btn.target = '_blank'; btn.rel = 'noopener noreferrer' }
      else { btn.classList.add('disabled'); btn.title = 'ID not available for this gene' }
      btn.innerHTML = `<span class="source-name">${source.name}</span><span class="source-arrow">→</span>`;
      sourceGrid.appendChild(btn);
    }
  }

  searchBtn.addEventListener('click', runSearch);
  geneInput.addEventListener('keydown', e => { if (e.key === 'Enter') runSearch() });
</script>
</body>
</html>
